<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; background: #eef2f5; }

        nav { background: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
        nav a { color: #ecf0f1; text-decoration: none; margin-left: 20px; font-weight: bold; }

        .container { display: flex; flex: 1; padding: 20px; gap: 20px; }
        .sidebar { width: 250px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        footer { background: #2c3e50; color: white; text-align: center; padding: 15px; }
    </style>
</head>
<body>

    <nav>
        <div><strong>Field_Journal Dashboard</strong></div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">Log In</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer>&copy; 2026 Field_Journal Project</footer>

</body>
</html>
