{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <nav class="topbar">
    <a href="{% url 'home' %}" class="brand">
      <span class="brand-mark">FJ</span>
      <div class="brand-text">
        <h1>Field Journal</h1>
        <p>a common place, kept daily</p>
      </div>
    </a>
    <div class="topbar-right">
      {% if user.is_authenticated %}
        <span class="whoami">Hello, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <label for='submit-logout'>
              <a class="ghost-btn">Log out</a>
            </label>
            <button id='submit-logout' type="submit" hidden></button>
        </form>
      {% else %}
        <a class="ghost-btn" href="/accounts/login/?next={{ request.path }}">Log in</a>
      {% endif %}
    </div>
  </nav>

  <div class="page-body">
    {% block content %}{% endblock %}
  </div>

  <footer class="site-footer">&copy; 2026 Field Journal</footer>

  <!-- IMAGE LIGHTBOX -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close">&times;</button>
    <button id="lightbox-prev" class="lightbox-nav lightbox-prev" type="button" aria-label="Previous image">&#10094;</button>
    <img id="lightbox-img" alt="">
    <button id="lightbox-next" class="lightbox-nav lightbox-next" type="button" aria-label="Next image">&#10095;</button>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast" hidden></div>

  {% block scripts %}{% endblock %}
</body>
</html>
