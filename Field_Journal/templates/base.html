{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

  <nav class="topbar">
    <a href="{% url 'home' %}" class="brand">
      <span class="brand-mark">FJ</span>
      <div class="brand-text">
        <h1>Field Journal</h1>
        <p>a common place, kept daily</p>
      </div>
    </a>
    <div class="topbar-right">
      {% if user.is_authenticated %}
        <span class="whoami">Hello, {{ user.username }}</span>
        <a class="ghost-btn" href="/accounts/logout/">Log out</a>
      {% else %}
        <a class="ghost-btn" href="/accounts/login/?next={{ request.path }}">Log in</a>
      {% endif %}
    </div>
  </nav>

  <div class="page-body">
    {% block content %}{% endblock %}
  </div>

  <footer class="site-footer">&copy; 2026 Field Journal</footer>

  <!-- TOAST -->
  <div id="toast" class="toast" hidden></div>

  {% block scripts %}{% endblock %}
</body>
</html>
