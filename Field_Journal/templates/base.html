<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 2px 5px #ccc; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        {% if user.is_authenticated %}
            <p>You are recognized</p>
        {% endif %}
        
        <h1>Image Upload</h1>

        {% block content %}{% endblock %}

        <input type="file" name="upload_images" multiple>
    </div>
</body>
</html>
